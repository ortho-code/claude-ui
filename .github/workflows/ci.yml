name: CI

on:
  # `main` only, not every branch.
  # A bare `push:` matches TAGS too, so pushing v0.1.0 ran this workflow alongside release.yml, which builds and tests the same commit itself.
  # And a push to a branch that has a pull request open would run this twice over — once for the push, once for the PR.
  # Restricting pushes to main leaves branches covered by their PR, and each commit tested once.
  push:
    branches:
      - main
  pull_request:

# Supersede rather than queue: pushing twice in a minute makes the first run's answer irrelevant, and a cancelled run costs nothing further. Keyed by ref so different branches never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      # We only build and unit-test here (no Electron run), so skip the ~100MB Electron binary.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # The window's own checks drive the built renderer in a headless Chromium, the build Playwright's version asks for.
      # Not cached: Playwright's own advice is that restoring one takes about as long as downloading it, and --with-deps installs the system libraries every run regardless.
      - run: npx playwright install --with-deps --only-shell chromium
      - id: renderer
        run: npm run test:renderer
      # A failed check keeps a trace of what the window did, which is the only way to see a failure nobody watched.
      # Only when the checks themselves failed: an earlier failure skips them, and there is no trace to keep.
      - uses: actions/upload-artifact@v7
        if: failure() && steps.renderer.outcome == 'failure'
        with:
          name: renderer-check-traces
          path: test-results/
          retention-days: 7
