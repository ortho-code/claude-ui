name: CI

on:
  push:
    # Branches only. A bare `push:` also matches TAGS, so pushing v0.1.0 ran this workflow alongside
    # release.yml — which builds and tests the same commit itself before packaging it. `'**'` matches
    # every branch, including ones with slashes, and no tags.
    branches:
      - '**'
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      # We only build and unit-test here (no Electron run), so skip the ~100MB Electron binary.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: npm test
