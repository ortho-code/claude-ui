name: Release

# Tag-driven, because a release should be a deliberate act rather than a side effect of pushing. `ci.yml` still covers every push and pull request; this only runs for a version tag.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      # Keep going if one platform fails: a working Linux artifact is still worth having while a mac problem is diagnosed, and vice versa.
      fail-fast: false
      matrix:
        include:
          # The OLDEST Ubuntu the .deb supports, never the newest: node-pty is compiled here and needs the glibc it was built against, so a build on 26.04 (glibc 2.43) does not load its terminal on 24.04 (2.39), while a build on 24.04 runs on both.
          # So a proposal to move this one forward is a decision to drop 24.04, not an upgrade.
          - os: ubuntu-24.04
            args: --linux
          - os: macos-latest
            # Apple Silicon only: no one who needs this build has an Intel Mac.
            # Adding --x64 would cross-compile node-pty on an arm64 runner, which is both the likeliest thing to fail and a doubling of the macOS minutes, which bill at 10x on a private repo.
            # Add it back the day someone turns up with an Intel Mac — an arm64 build will not run on one.
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      # No ELECTRON_SKIP_BINARY_DOWNLOAD here, unlike ci.yml: packaging needs the real binary.
      - run: npm ci
      # Linux only: lint reads the source, not the platform, so a macOS run would bill 10x minutes for the same answer.
      # Failing here still stops the release, which needs every build.
      - if: runner.os == 'Linux'
        run: npm run lint
      - run: npm run build
      - run: npm test
      # --publish never: this job only produces files. The release job below decides what happens to them, so a failed upload can never leave a half-published release behind.
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          # Only a handoff to the release job, which attaches its own copies to the release, and the free tier's 500MB of Actions storage fits little more than one release's worth. A day still leaves room to re-run a failed release job.
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.AppImage
            release/*.dmg

  release:
    needs: build
    # Builds nothing, so it follows CI's image rather than the Linux build's.
    runs-on: ubuntu-26.04
    permissions:
      # The only writes this workflow needs, and only in this job.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # Published, not a draft: a draft is invisible to read-only collaborators, who would see an empty Releases page. The repo is private, so published still means visible only to them.
      # The release notes ARE the changelog entry, not a generated commit list: the changelog is written for the people installing this, and a commit list is not.
      # Extracts the section for this tag — everything from its own heading up to the next one.
      - run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # An empty section means the tag was pushed without writing its entry. Fail rather than publish a release that says nothing about itself.
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}
      # The release now holds its own copies, so the handoff artifacts are dead weight against the storage quota. Runs only after a successful release, so a failed one keeps them for a re-run of this job.
      - run: gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' | xargs -r -I{} gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
        env:
          GH_TOKEN: ${{ github.token }}
