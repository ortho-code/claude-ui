<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>claude-ui</title>
    <link rel="stylesheet" href="./xterm.css" />
    <link rel="stylesheet" href="./air-datepicker.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <div id="folder-switcher">
            <button id="switcher-current" type="button" aria-haspopup="true" aria-expanded="false" data-tooltip="Switch project">
              <span id="switcher-name">All</span>
              <span class="switcher-right">
                <span id="switcher-badge" class="folder-badge" hidden></span>
                <span class="switcher-chev" aria-hidden="true">&#9662;</span>
              </span>
            </button>
            <div id="switcher-popover" role="menu" hidden></div>
          </div>
          <div class="header-actions">
            <button id="filter-toggle" data-tooltip="Filter sessions" aria-expanded="false"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5" /><line x1="10.5" y1="10.5" x2="14" y2="14" stroke-linecap="round" /></svg></button>
            <button id="new-session" data-tooltip="New session in a folder…">+ New</button>
          </div>
        </header>
        <div id="filter-panel" hidden>
          <input id="search" type="search" placeholder="Search sessions…" aria-label="Search sessions" />
          <div id="filters">
            <button id="pinned-filter" data-tooltip="Show only pinned sessions" aria-pressed="false">★</button>
            <button id="worktree-filter" type="button" data-tooltip="Show only worktree sessions" aria-pressed="false">worktree</button>
            <button id="archived-filter" type="button" data-tooltip="Show archived sessions" aria-pressed="false">archived</button>
            <div id="date-presets">
              <button type="button" data-range="any" class="active">Any time</button>
              <button type="button" data-range="today">Today</button>
              <button type="button" data-range="7d">7 days</button>
              <button type="button" data-range="30d">30 days</button>
              <button type="button" data-range="custom">Custom</button>
            </div>
          </div>
          <button type="button" id="date-range-label" hidden>Pick a start and end date</button>
          <div id="date-custom" hidden>
            <div id="date-range"></div>
            <div id="date-range-caption"></div>
          </div>
          <div id="filter-status" hidden>
            <span id="filter-count"></span>
            <button id="filter-clear" type="button">Clear</button>
          </div>
        </div>
        <div id="loading"></div>
        <div id="sessions" aria-live="polite"></div>
        <div id="sidebar-footer">
          <div id="footer-list" hidden></div>
          <button id="footer-toggle" type="button" aria-expanded="false">
            <span id="footer-badge" class="folder-badge" hidden></span>
            <span id="footer-label">All clear</span>
            <span class="footer-chev" aria-hidden="true">&#9662;</span>
          </button>
        </div>
      </aside>
      <div id="sidebar-resizer" data-tooltip="Drag to resize"></div>
      <section id="terminal-pane">
        <div id="tabbar"></div>
        <div id="terminals">
          <div id="term-placeholder">Select a session on the left to resume it.</div>
        </div>
      </section>
    </div>
    <div id="confirm-overlay" hidden>
      <div id="confirm-dialog" role="dialog" aria-modal="true">
        <p id="confirm-message"></p>
        <p id="confirm-detail"></p>
        <div id="confirm-actions">
          <button id="confirm-cancel" type="button">Cancel</button>
          <button id="confirm-ok" type="button" class="danger">Delete</button>
        </div>
      </div>
    </div>
    <div id="rename-overlay" hidden>
      <div id="rename-dialog" role="dialog" aria-modal="true">
        <p id="rename-title">Rename project</p>
        <p id="rename-path"></p>
        <input id="rename-input" type="text" aria-label="Project name" />
        <div id="rename-actions">
          <button id="rename-cancel" type="button">Cancel</button>
          <button id="rename-ok" type="button">Save</button>
        </div>
      </div>
    </div>
    <div id="toast" hidden>
      <span id="toast-message"></span>
      <button id="toast-close" type="button" data-tooltip="Dismiss" aria-label="Dismiss">×</button>
    </div>
    <div id="notifications"></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
