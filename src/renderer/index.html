<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- img-src spelled out rather than left to default-src: the app mark in the title bar is a real file next to this one, and a file:// page is not reliably its own origin. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>claude-ui</title>
    <link rel="stylesheet" href="./xterm.css" />
    <link rel="stylesheet" href="./air-datepicker.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Our title bar. A strip of its own rather than controls folded into the row below, which was
         tried first: with the tab bar wrapping to two rows there was almost no empty space left to
         grab, so the window became hard to move. See .plan/plan_window-chrome.md. -->
    <div id="titlebar" hidden>
      <!-- The top three resize handles live INSIDE the bar, not laid over it: no-drag only carves out
           of a drag region it is a descendant of, so as siblings they were ignored and the top edge
           never resized. The other five are outside, below, where nothing is draggable. -->
      <div class="resize-edge" data-edge="nw"></div>
      <div class="resize-edge" data-edge="n"></div>
      <div class="resize-edge" data-edge="ne"></div>
      <img id="app-mark" src="./icon.png" alt="" width="16" height="16" />
      <span id="window-title"></span>
      <div id="window-controls">
        <button id="win-minimize" type="button" data-tooltip="Minimize" aria-label="Minimize"></button>
        <button id="win-maximize" type="button" data-tooltip="Maximize" aria-label="Maximize"></button>
        <button id="win-close" type="button" class="danger" data-tooltip="Close" aria-label="Close"></button>
      </div>
    </div>
    <div id="app">
      <aside id="sidebar">
        <header>
          <div id="project-switcher">
            <button id="switcher-current" type="button" aria-haspopup="true" aria-expanded="false" data-tooltip="Switch project">
              <span id="switcher-name">All</span>
              <span class="switcher-right">
                <span id="switcher-badge" class="nudge" hidden></span>
                <span class="switcher-chev" aria-hidden="true"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.89" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6L8 10L12 6" /></svg></span>
              </span>
            </button>
            <div id="switcher-popover" role="menu" hidden></div>
          </div>
          <div class="header-actions">
            <button id="settings-toggle" class="icon-btn large" data-tooltip="Settings" aria-label="Settings" aria-haspopup="dialog"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.49" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.6h8.1M13.1 4.6h.9M2 11.4h2.9M7.9 11.4h6.1" /><circle cx="11.7" cy="4.6" r="1.6" /><circle cx="6.4" cy="11.4" r="1.6" /></svg></button>
            <button id="collapse-toggle" class="icon-btn large" data-tooltip="Collapse all" aria-label="Collapse all"></button>
            <button id="filter-toggle" class="icon-btn large" data-tooltip="Filter sessions" aria-expanded="false"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.49"><circle cx="7" cy="7" r="4.5" /><line x1="10.5" y1="10.5" x2="14" y2="14" stroke-linecap="round" /></svg></button>
            <button id="new-session" data-tooltip="New session in a folder…">+ New</button>
          </div>
        </header>
        <div id="filter-panel" hidden>
          <input id="search" type="search" placeholder="Search sessions…" aria-label="Search sessions" />
          <div id="filters">
            <button id="pinned-filter" data-tooltip="Show only pinned sessions" aria-label="Show only pinned sessions" aria-pressed="false"></button>
            <button id="open-filter" type="button" data-tooltip="Show only sessions with a tab open" aria-label="Show only sessions with a tab open" aria-pressed="false"></button>
            <button id="live-filter" type="button" data-tooltip="Show only live sessions" aria-label="Show only live sessions" aria-pressed="false"></button>
            <button id="worktree-filter" type="button" data-tooltip="Show only worktree sessions" aria-label="Show only worktree sessions" aria-pressed="false"></button>
            <button id="sibling-filter" type="button" data-tooltip="Show only sessions with siblings" aria-label="Show only sessions with siblings" aria-pressed="false"></button>
            <button id="note-filter" type="button" data-tooltip="Show only sessions with a note" aria-label="Show only sessions with a note" aria-pressed="false"></button>
            <button id="archived-filter" type="button" data-tooltip="Show archived sessions" aria-label="Show archived sessions" aria-pressed="false"></button>
            <div id="date-presets">
              <button type="button" data-range="any" class="active">Any</button>
              <button type="button" data-range="today">Today</button>
              <button type="button" data-range="7d">7d</button>
              <button type="button" data-range="30d">30d</button>
              <button type="button" data-range="custom">Custom</button>
            </div>
          </div>
          <button type="button" id="date-range-label" hidden>Pick a start and end date</button>
          <div id="date-custom" hidden>
            <div id="date-range"></div>
            <div id="date-range-caption"></div>
          </div>
          <div id="filter-status" hidden>
            <span id="filter-count"></span>
            <button id="filter-clear" type="button">Clear</button>
          </div>
        </div>
        <div id="loading"></div>
        <div id="sessions" aria-live="polite"></div>
        <div id="sidebar-footer" hidden>
          <div id="footer-list" hidden></div>
          <button id="footer-toggle" type="button" aria-expanded="false">
            <span id="footer-badge" class="nudge" hidden></span>
            <span id="footer-label"></span>
            <span class="footer-chev" aria-hidden="true"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.89" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6L8 10L12 6" /></svg></span>
          </button>
        </div>
      </aside>
      <div id="sidebar-resizer" data-tooltip="Drag to resize"></div>
      <section id="terminal-pane">
        <div id="tabbar"></div>
        <div id="terminals">
          <div id="term-placeholder">Pick a tab above, or a session in the sidebar, to resume it.</div>
        </div>
      </section>
    </div>
    <div id="confirm-overlay" class="overlay" hidden>
      <div id="confirm-dialog" class="dialog" role="dialog" aria-modal="true">
        <p id="confirm-message" class="dialog-title"></p>
        <p id="confirm-detail" class="dialog-detail"></p>
        <div id="confirm-actions" class="dialog-actions">
          <button id="confirm-cancel" type="button">Cancel</button>
          <button id="confirm-ok" type="button" class="danger">Delete</button>
        </div>
      </div>
    </div>
    <div id="rename-overlay" class="overlay" hidden>
      <div id="rename-dialog" class="dialog" role="dialog" aria-modal="true">
        <p id="rename-title" class="dialog-title">Rename project</p>
        <p id="rename-path" class="dialog-detail"></p>
        <input id="rename-input" class="dialog-field" type="text" aria-label="Project name" />
        <textarea id="rename-textarea" class="dialog-field" rows="6" aria-label="Note" hidden></textarea>
        <p id="rename-error" class="dialog-error" hidden></p>
        <div id="rename-actions" class="dialog-actions">
          <button id="rename-cancel" type="button">Cancel</button>
          <button id="rename-ok" type="button">Save</button>
        </div>
      </div>
    </div>
    <!-- App preferences. One section for now; the shape is per-section so a second one (a read-only
         view of the user's own Claude config) is an addition rather than a rework. -->
    <div id="settings-overlay" class="overlay" hidden>
      <div id="settings-dialog" class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <p id="settings-title" class="dialog-title">Settings</p>
        <div class="dialog-section">
          <label class="dialog-label" for="settings-flags">Default launch flags</label>
          <p class="dialog-detail">Added to every session started from now on. Sessions already running keep the flags they started with.</p>
          <input id="settings-flags" class="dialog-field" type="text" spellcheck="false" autocomplete="off" placeholder="--allowedTools Grep,Glob" />
          <p id="settings-error" class="dialog-error" hidden></p>
        </div>
        <div class="dialog-actions">
          <button id="settings-cancel" type="button">Cancel</button>
          <button id="settings-ok" type="button">Save</button>
        </div>
      </div>
    </div>
    <!-- The remaining edges and corners. Fixed to the window, above everything, and only shown where
         we draw the chrome — see .plan/plan_window-chrome.md. -->
    <div id="resize-edges" hidden>
      <div class="resize-edge" data-edge="w"></div>
      <div class="resize-edge" data-edge="e"></div>
      <div class="resize-edge" data-edge="s"></div>
      <div class="resize-edge" data-edge="sw"></div>
      <div class="resize-edge" data-edge="se"></div>
    </div>
    <div id="toast" hidden>
      <span id="toast-message"></span>
      <button id="toast-close" class="icon-btn" type="button" data-tooltip="Dismiss" aria-label="Dismiss"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.49" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 4.6L11.4 11.4M11.4 4.6L4.6 11.4" /></svg></button>
    </div>
    <div id="notifications"></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
