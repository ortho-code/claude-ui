<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>claude-ui</title>
    <link rel="stylesheet" href="./xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <h1>Sessions</h1>
          <div class="header-actions">
            <button id="new-session" title="New session in a folder…">+ New</button>
            <button id="refresh">Refresh</button>
          </div>
        </header>
        <input id="search" type="search" placeholder="Search sessions…" aria-label="Search sessions" />
        <div id="loading"></div>
        <div id="sessions" aria-live="polite"></div>
      </aside>
      <section id="terminal-pane">
        <div id="tabbar"></div>
        <div id="terminals">
          <div id="term-placeholder">Select a session on the left to resume it.</div>
        </div>
      </section>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
