<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- img-src spelled out rather than left to default-src: the app mark in the title bar is a real file next to this one, and a file:// page is not reliably its own origin. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>claude-ui</title>
    <link rel="stylesheet" href="./air-datepicker.css" />
    <!-- Every stylesheet a module imports, bundled by esbuild in import order. -->
    <link rel="stylesheet" href="./renderer.css" />
  </head>
  <body>
    <div id="app"></div>
    <!--
      #app is drawn by panels/tree.ts from the layout file, and the sidebar and the terminal area, which their types build (panels/types/sessions/, panels/types/claude/), are moved into it as panels before the first paint.
      One the layout lets go of is parked here, never rebuilt, so whatever runs in it keeps running.
    -->
    <div id="parked" hidden></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
