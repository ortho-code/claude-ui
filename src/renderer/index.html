<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>claude-ui</title>
    <link rel="stylesheet" href="./xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <h1>Sessions</h1>
          <div class="header-actions">
            <button id="filter-toggle" title="Filter sessions" aria-expanded="false"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5" /><line x1="10.5" y1="10.5" x2="14" y2="14" stroke-linecap="round" /></svg></button>
            <button id="new-session" title="New session in a folder…">+ New</button>
          </div>
        </header>
        <div id="filter-panel" hidden>
          <input id="search" type="search" placeholder="Search sessions…" aria-label="Search sessions" />
          <div id="filters">
            <button id="pinned-filter" title="Show only pinned sessions" aria-pressed="false">★</button>
            <button id="worktree-filter" type="button" title="Show only worktree sessions" aria-pressed="false">worktree</button>
            <div id="date-presets">
              <button type="button" data-range="any" class="active">Any time</button>
              <button type="button" data-range="today">Today</button>
              <button type="button" data-range="7d">7 days</button>
              <button type="button" data-range="30d">30 days</button>
              <button type="button" data-range="custom">Custom</button>
            </div>
          </div>
          <div id="date-custom" hidden>
            <input type="date" id="date-from" aria-label="From date" />
            <input type="date" id="date-to" aria-label="To date" />
          </div>
          <div id="filter-status" hidden>
            <span id="filter-count"></span>
            <button id="filter-clear" type="button">Clear</button>
          </div>
        </div>
        <div id="loading"></div>
        <div id="sessions" aria-live="polite"></div>
      </aside>
      <section id="terminal-pane">
        <div id="tabbar"></div>
        <div id="terminals">
          <div id="term-placeholder">Select a session on the left to resume it.</div>
        </div>
      </section>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
